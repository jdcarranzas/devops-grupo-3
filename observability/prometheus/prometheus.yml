# =============================================================================
# Prometheus: recolección de telemetría de Keycloak, PostgreSQL y contenedores
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    proyecto: devops-grupo-3
    ambiente: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Keycloak publica sus métricas (Micrometer) en el puerto de gestión 9000.
  # No es necesario publicar ese puerto en el host: Prometheus llega por la red backend.
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["kc-app:9000"]
        labels:
          servicio: keycloak

  # PostgreSQL no expone métricas Prometheus por sí mismo: postgres_exporter
  # se conecta por la red backend y las traduce.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          servicio: postgresql

  # CPU, memoria, red y disco por contenedor (saturación a nivel de contenedor).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Solo se guardan las series de los contenedores con nombre (descarta cgroups del sistema).
      - source_labels: [name]
        regex: ""
        action: drop

  # Automonitoreo de la propia pila.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
