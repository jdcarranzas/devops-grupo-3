# =============================================================================
# Prometheus: recolección de telemetría de Keycloak, PostgreSQL y contenedores
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    proyecto: devops-grupo-3
    # Ambiente observado (la pila se une a keycloak-prod-backend por defecto).
    ambiente: prod

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Keycloak publica sus métricas (Micrometer) en el puerto de gestión 9000.
  # No es necesario publicar ese puerto en el host: Prometheus llega por la red backend.
  # Se lista cada réplica por su alias estable (keycloak-1, keycloak-2), así una
  # réplica caída aparece como up == 0 en lugar de desaparecer.
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak-1:9000", "keycloak-2:9000"]
        labels:
          servicio: keycloak
    relabel_configs:
      - source_labels: [__address__]
        regex: "(keycloak-[0-9]+):.*"
        target_label: replica
        replacement: "$1"

  # HAProxy (balanceador): exportador Prometheus nativo en el puerto 8404.
  # Muestra cuántas réplicas están UP, el tráfico por réplica y los reintentos.
  - job_name: haproxy
    static_configs:
      - targets: ["keycloak-lb:8404"]
        labels:
          servicio: balanceador

  # PostgreSQL no expone métricas Prometheus por sí mismo: postgres_exporter
  # se conecta por la red backend y las traduce.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          servicio: postgresql

  # CPU, memoria, red y disco por contenedor (saturación a nivel de contenedor).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Solo se guardan las series de los contenedores con nombre (descarta cgroups del sistema).
      - source_labels: [name]
        regex: ""
        action: drop

  # Automonitoreo de la propia pila.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
