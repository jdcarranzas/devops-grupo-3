# =============================================================================
# Alertas de Keycloak basadas en el consumo del presupuesto de error (burn rate)
#
# Esquema "multiwindow, multi-burn-rate" del Google SRE Workbook (cap. 5):
#   cada alerta exige que la tasa de error supere el umbral en una ventana LARGA
#   (da significancia: no alerta por un pico aislado) Y en una ventana CORTA
#   (garantiza que el problema sigue ocurriendo: la alerta se apaga rápido
#   cuando se mitiga).
#
#   Severidad | Burn rate | Ventana larga / corta | Presupuesto consumido
#   ----------+-----------+-----------------------+-----------------------
#   critical  |   14.4x   |      1h  /  5m        |  2 % en 1 hora
#   critical  |    6x     |      6h  /  30m       |  5 % en 6 horas
#   warning   |    3x     |      1d  /  2h        | 10 % en 1 día
#   warning   |    1x     |      3d  /  6h        | 10 % en 3 días
#
#   Umbral sobre la tasa de error = burn rate x (1 - SLO)
#     Disponibilidad (SLO 99.5 %, presupuesto 0.5 %): 0.072 | 0.03 | 0.015 | 0.005
#     Latencia       (SLO 95 %,   presupuesto 5 %)  : 0.72  | 0.30 | 0.15  | 0.05
#
# No hay alertas estáticas sobre CPU, memoria o latencia puntual: esas señales se
# ven en el dashboard pero no despiertan a nadie. Las dos únicas alertas que no son
# de burn rate cubren el caso en que el SLI no se puede calcular (sin métricas).
# =============================================================================
groups:
  - name: keycloak-slo-alertas
    rules:
      # ---------------------------- Disponibilidad ----------------------------
      - alert: KeycloakDisponibilidadBurnRateAlto
        expr: |
          (
              keycloak:sli_disponibilidad:error_ratio_rate1h > (14.4 * 0.005)
            and
              keycloak:sli_disponibilidad:error_ratio_rate5m > (14.4 * 0.005)
          )
          or
          (
              keycloak:sli_disponibilidad:error_ratio_rate6h > (6 * 0.005)
            and
              keycloak:sli_disponibilidad:error_ratio_rate30m > (6 * 0.005)
          )
        for: 2m
        labels:
          severity: critical
          slo: disponibilidad
        annotations:
          summary: "Keycloak está consumiendo rápido el presupuesto de error de disponibilidad"
          description: >-
            Más del 7.2 % (1 h) o del 3 % (6 h) de las peticiones a /realms/* terminan en 5xx.
            A este ritmo el presupuesto mensual (0.5 %) se agota en horas.
          runbook_url: >-
            https://github.com/jdcarranzas/devops-grupo-3/blob/main/observability/runbooks/RB-01-errores-5xx.md
          dashboard: "http://localhost:3000/d/keycloak-slo"

      - alert: KeycloakDisponibilidadBurnRateLento
        expr: |
          (
              keycloak:sli_disponibilidad:error_ratio_rate1d > (3 * 0.005)
            and
              keycloak:sli_disponibilidad:error_ratio_rate2h > (3 * 0.005)
          )
          or
          (
              keycloak:sli_disponibilidad:error_ratio_rate3d > (1 * 0.005)
            and
              keycloak:sli_disponibilidad:error_ratio_rate6h > (1 * 0.005)
          )
        for: 15m
        labels:
          severity: warning
          slo: disponibilidad
        annotations:
          summary: "Degradación sostenida del SLO de disponibilidad de Keycloak"
          description: >-
            La tasa de errores 5xx consume el presupuesto más rápido de lo sostenible
            (3x en 1 día o 1x en 3 días). Crear ticket y revisar en horario laboral.
          runbook_url: >-
            https://github.com/jdcarranzas/devops-grupo-3/blob/main/observability/runbooks/RB-01-errores-5xx.md

      # ------------------------------- Latencia -------------------------------
      - alert: KeycloakLatenciaBurnRateAlto
        expr: |
          (
              keycloak:sli_latencia:error_ratio_rate1h > (14.4 * 0.05)
            and
              keycloak:sli_latencia:error_ratio_rate5m > (14.4 * 0.05)
          )
          or
          (
              keycloak:sli_latencia:error_ratio_rate6h > (6 * 0.05)
            and
              keycloak:sli_latencia:error_ratio_rate30m > (6 * 0.05)
          )
        for: 2m
        labels:
          severity: critical
          slo: latencia
        annotations:
          summary: "Keycloak está consumiendo rápido el presupuesto de error de latencia"
          description: >-
            Más del 72 % (1 h) o del 30 % (6 h) de las peticiones a /realms/* tardan más de 250 ms.
          runbook_url: >-
            https://github.com/jdcarranzas/devops-grupo-3/blob/main/observability/runbooks/RB-02-latencia.md
          dashboard: "http://localhost:3000/d/keycloak-slo"

      - alert: KeycloakLatenciaBurnRateLento
        expr: |
          (
              keycloak:sli_latencia:error_ratio_rate1d > (3 * 0.05)
            and
              keycloak:sli_latencia:error_ratio_rate2h > (3 * 0.05)
          )
          or
          (
              keycloak:sli_latencia:error_ratio_rate3d > (1 * 0.05)
            and
              keycloak:sli_latencia:error_ratio_rate6h > (1 * 0.05)
          )
        for: 15m
        labels:
          severity: warning
          slo: latencia
        annotations:
          summary: "Degradación sostenida del SLO de latencia de Keycloak"
          description: >-
            Más del 15 % (1 día) o del 5 % (3 días) de las peticiones superan 250 ms.
          runbook_url: >-
            https://github.com/jdcarranzas/devops-grupo-3/blob/main/observability/runbooks/RB-02-latencia.md

      # ------------------------- Política de presupuesto ------------------------
      - alert: KeycloakPresupuestoErrorAgotado
        expr: |
          keycloak:slo_disponibilidad:presupuesto_restante <= 0
          or
          keycloak:slo_latencia:presupuesto_restante <= 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Presupuesto de error agotado: aplicar congelamiento de cambios"
          description: >-
            El presupuesto de error de 30 días se agotó. Según la Error Budget Policy solo se
            despliegan correcciones de confiabilidad o seguridad hasta recuperar saldo.

  # ---------------------------------------------------------------------------
  # Sin métricas no hay SLI: si Keycloak o el exporter de PostgreSQL dejan de
  # responder, el burn rate no se puede calcular (0/0). Estas dos alertas cubren
  # ese punto ciego y son de síntoma (servicio caído), no de causa. Con dos
  # réplicas (Entregable 4) se distingue "una réplica caída" (warning: se perdió
  # la redundancia) de "ninguna réplica responde" (critical).
  # ---------------------------------------------------------------------------
  - name: keycloak-disponibilidad-objetivos
    rules:
      # Ninguna réplica entrega métricas: el servicio está caído por completo.
      - alert: KeycloakNoResponde
        expr: sum(up{job="keycloak"}) == 0 or absent(up{job="keycloak"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Ninguna réplica de Keycloak responde"
          description: "Prometheus no puede leer /metrics de ninguna réplica (keycloak-N:9000) hace más de 2 min."
          runbook_url: >-
            https://github.com/jdcarranzas/devops-grupo-3/blob/main/observability/runbooks/RB-01-errores-5xx.md

      # Una réplica caída NO afecta a los usuarios (el balanceador la saca del
      # pool), pero la plataforma pierde su redundancia: una segunda falla sería
      # una caída total. Es un ticket (warning), no una página.
      - alert: KeycloakReplicaCaida
        expr: up{job="keycloak"} == 0 and on() sum(up{job="keycloak"}) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Réplica {{ $labels.replica }} de Keycloak fuera de servicio: sin redundancia"
          description: >-
            {{ $labels.instance }} no responde. El balanceador atiende con las réplicas restantes,
            pero una segunda falla dejaría el servicio caído.
          runbook_url: >-
            https://github.com/jdcarranzas/devops-grupo-3/blob/main/observability/runbooks/RB-03-replica-caida.md

      # El balanceador no tiene ninguna réplica sana: todo usuario recibe 503 de HAProxy.
      # Se mide en HAProxy y no en Keycloak porque, en ese caso, ninguna petición llega a
      # Keycloak y el SLI (calculado con sus métricas) queda en 0/0 sin alertar.
      - alert: BalanceadorSinReplicas
        expr: max(haproxy_backend_active_servers{proxy="be_keycloak"}) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HAProxy no tiene réplicas sanas de Keycloak: responde 503 a todos los usuarios"
          description: >-
            Ninguna réplica pasa el health check. El SLI de Keycloak no ve estas peticiones porque no
            llegan a las réplicas: el impacto real solo se ve en las métricas del balanceador.
          runbook_url: >-
            https://github.com/jdcarranzas/devops-grupo-3/blob/main/observability/runbooks/RB-01-errores-5xx.md

      # 5xx entregados al usuario por el balanceador (503 por cola llena, 504 por timeout,
      # 503 sin réplicas). Keycloak no ve estas respuestas: no llegan a la aplicación.
      # Mismo umbral multiventana que el SLO de disponibilidad (14.4x en 1 h y 5 m).
      - alert: BalanceadorBurnRateAlto
        expr: |
          (
              sum(rate(haproxy_frontend_http_responses_total{proxy="fe_keycloak", code="5xx"}[1h]))
            /
              sum(rate(haproxy_frontend_http_responses_total{proxy="fe_keycloak"}[1h]))
            > (14.4 * 0.005)
          )
          and
          (
              sum(rate(haproxy_frontend_http_responses_total{proxy="fe_keycloak", code="5xx"}[5m]))
            /
              sum(rate(haproxy_frontend_http_responses_total{proxy="fe_keycloak"}[5m]))
            > (14.4 * 0.005)
          )
        for: 2m
        labels:
          severity: critical
          slo: disponibilidad
        annotations:
          summary: "El balanceador entrega muchos 5xx que Keycloak no registra"
          description: >-
            Más del 7.2 % de las respuestas del balanceador son 5xx (cola llena, timeout o sin réplicas).
            Revisar saturación de las réplicas (RB-02) y el estado de HAProxy en /stats.
          runbook_url: >-
            https://github.com/jdcarranzas/devops-grupo-3/blob/main/observability/runbooks/RB-02-latencia.md

      - alert: PostgreSQLCaido
        expr: pg_up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL (persistencia de Keycloak) no acepta conexiones"
          description: "postgres_exporter reporta pg_up = 0: Keycloak no puede leer ni escribir datos."
          runbook_url: >-
            https://github.com/jdcarranzas/devops-grupo-3/blob/main/observability/runbooks/RB-01-errores-5xx.md
