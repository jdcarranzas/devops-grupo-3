# =============================================================================
# Loki (modo monolítico, un solo nodo): almacén de logs del laboratorio.
#   - Almacenamiento en el sistema de archivos del contenedor (volumen lokidata).
#   - Esquema v13 con índice TSDB (el recomendado en Loki 3.x).
#   - Retención de 7 días: suficiente para el GameDay y los diagnósticos; los
#     SLOs se calculan con métricas en Prometheus (35 días), no con logs.
# En la nube se usaría Loki con almacenamiento de objetos (S3/GCS) o Grafana Cloud Logs.
# =============================================================================
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
