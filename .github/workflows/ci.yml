# =============================================================================
# Pipeline de Integración Continua (CI) - Keycloak
#   1. Lint     : hadolint (Dockerfile) + yamllint + validación de docker-compose
#   2. Build    : construcción de la imagen con Buildx (caché de GitHub Actions)
#   3. Scan     : escaneo de vulnerabilidades de la imagen con Trivy
#   4. Publish  : publicación en GitHub Container Registry (solo en push a main)
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: 1. Lint (Dockerfile y manifiestos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Lint YAML (yamllint)
        run: |
          pip install --quiet yamllint
          yamllint .

      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "docker-compose.yml válido"

  # ---------------------------------------------------------------------------
  build-scan-publish:
    name: 2-4. Build, Scan y Publish
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generar tags y labels de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      # 2. Build: se construye y se carga en el runner (aún no se publica)
      - name: Build de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            keycloak-ci:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Scan: reporte completo (no bloquea) + compuerta que falla con CRITICAL
      # Nota: trivy-action 0.35.0 es la versión segura tras el incidente CVE-2026-33634
      - name: Trivy - reporte completo
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: keycloak-ci:scan
          format: table
          output: trivy-report.txt
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Publicar reporte de Trivy como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Trivy - compuerta de seguridad (CRITICAL con parche disponible)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: keycloak-ci:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      # 4. Publish: solo cuando el cambio llega a main (no en Pull Requests)
      - name: Login en GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
